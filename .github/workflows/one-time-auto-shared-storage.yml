name: One-time shared storage migration

on:
  push:
    paths:
      - '.github/workflows/one-time-auto-shared-storage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html for automatic class/week storage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          url='https://script.google.com/macros/s/AKfycbwS7l_Uf_JVNrtzQk14IyyReQF1omCGk_a8WIz6big35aM8U9lrCZonqkA2_P5Jo7ntaQ/exec'

          s=s.replace('<button class="btn" id="serverBtn">🌐 공유 서버 연결</button>', '<button class="btn" id="serverBtn">🌐 온라인 공유 저장</button>')
          s=s.replace('· 좁은 화면에서는 요일별 보기로 자동 전환됩니다. <code>🌐 공유 서버 연결</code> 주소가 있으면 같은 주소를 여는 누구나 보고 고칠 수 있어, 학부모도 인쇄 없이 바로 봅니다.', '· 좁은 화면에서는 요일별 보기로 자동 전환됩니다. <b>온라인 공유 저장은 자동 연결</b>되며, 1~9반 자료가 반·주차별로 나뉘어 저장되어 다른 컴퓨터에서도 같은 내용을 확인·수정할 수 있습니다.')

          s=re.sub(r"/\* ★★★ 주간학습 안내 전용 공유 서버 주소를 여기에 붙여넣으면,[\s\S]*?let wserver=DEFAULT_WSERVER; try\{ wserver=localStorage\.getItem\(WSERVER_KEY\)\|\|DEFAULT_WSERVER; \}catch\(e\)\{\}", f"/* 주간학습 안내 공유 저장 서버 — 모든 사용자가 자동 연결 */\nconst DEFAULT_WSERVER='{url}';\n\nconst WKEY='shinchang5_weekly_v2';\nconst HAS_WS=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';\nlet wserver=DEFAULT_WSERVER;", s, count=1)

          new_storage=r'''function normState(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) return {plans:{},tt:null,subjColors:{},_sync:{updatedAt:0,items:{}}};
  const sync=(d._sync&&typeof d._sync==='object')?d._sync:{};
  return {
    plans:(d.plans&&typeof d.plans==='object')?d.plans:{},
    tt:(d.tt&&typeof d.tt==='object')?d.tt:null,
    subjColors:(d.subjColors&&typeof d.subjColors==='object')?d.subjColors:{},
    _sync:{updatedAt:Number(sync.updatedAt)||0,items:(sync.items&&typeof sync.items==='object')?sync.items:{}}
  };
}
function sliceKey(cls,week){ return week+'#'+cls; }
function sliceStamp(cls,week){
  const items=STATE&&STATE._sync&&STATE._sync.items;
  return items ? (Number(items[sliceKey(cls,week)])||0) : 0;
}
function makeSlice(cls,week){
  const key=sliceKey(cls,week);
  const plan=STATE.plans&&STATE.plans[key] ? clone(STATE.plans[key]) : null;
  const tt=(STATE.tt&&STATE.tt[cls]) ? clone(STATE.tt[cls]) : null;
  return {plan:plan,tt:tt,subjColors:clone(STATE.subjColors||{}),_sync:{updatedAt:sliceStamp(cls,week)}};
}
function mergeSlice(cls,week,data,stamp){
  if(!data||typeof data!=='object') return false;
  const key=sliceKey(cls,week);
  if(data.plan&&typeof data.plan==='object') STATE.plans[key]=data.plan;
  else if(data.plan===null && STATE.plans[key]) delete STATE.plans[key];
  if(data.tt&&typeof data.tt==='object'){
    STATE.tt=STATE.tt||{}; STATE.tt[cls]=data.tt;
  }
  if(data.subjColors&&typeof data.subjColors==='object') STATE.subjColors=data.subjColors;
  STATE._sync=STATE._sync||{}; STATE._sync.items=STATE._sync.items||{};
  STATE._sync.items[key]=Number(stamp||(data._sync&&data._sync.updatedAt))||0;
  STATE._sync.updatedAt=Math.max(Number(STATE._sync.updatedAt)||0,STATE._sync.items[key]);
  try{ localStorage.setItem(WKEY,JSON.stringify(STATE)); }catch(e){ console.warn('local sync backup failed',e); }
  return true;
}
function remoteURL(cls,week){
  return wserver+(wserver.indexOf('?')>=0?'&':'?')+'class='+encodeURIComponent(cls)+'&week='+encodeURIComponent(week)+'&t='+Date.now();
}
async function fetchRemoteSlice(cls,week){
  const res=await fetch(remoteURL(cls,week));
  if(!res.ok) throw new Error('HTTP '+res.status);
  const out=JSON.parse(await res.text());
  if(!out||out.ok===false) throw new Error((out&&out.error)||'server response error');
  return out;
}
async function loadState(){
  let local=null;
  try{ const r=localStorage.getItem(WKEY); if(r) local=normState(JSON.parse(r)); }catch(e){ console.warn('local load failed',e); }
  if(!local&&HAS_WS){
    try{ const r=await window.storage.get(WKEY,true); if(r&&r.value) local=normState(JSON.parse(r.value)); }
    catch(e){ console.warn('shared load failed',e); }
  }
  const chosen=local||normState(null);
  try{ localStorage.setItem(WKEY,JSON.stringify(chosen)); }catch(e){ console.warn('local backup failed',e); }
  return chosen;
}
async function syncCurrentFromServer(showMessage){
  if(!wserver) return;
  const cls=curClass, week=curMon, key=sliceKey(cls,week);
  try{
    const out=await fetchRemoteSlice(cls,week);
    const remoteStamp=Number(out.updatedAt)||0;
    const localStamp=sliceStamp(cls,week);
    if(out.data && remoteStamp>localStamp){
      mergeSlice(cls,week,out.data,remoteStamp);
      if(cls===curClass&&week===curMon) render();
      if(showMessage) flash('온라인 최신 내용 반영됨');
    }else if(!out.data && localStamp>0){
      // 서버가 비어 있고 이 브라우저에 기존 자료가 있으면 자동으로 최초 업로드
      await postSlice(cls,week);
      if(showMessage) flash('기존 자료를 온라인에 올렸습니다');
    }else if(showMessage){
      flash('온라인 최신 상태입니다');
    }
  }catch(e){ console.warn('server sync failed',e); if(showMessage) flash('온라인 연결 확인 필요 · 브라우저 저장은 유지됨'); }
}
async function postSlice(cls,week){
  const body=JSON.stringify({class:cls,week:week,data:makeSlice(cls,week)});
  const r=await fetch(wserver,{method:'POST',headers:{'Content-Type':'text/plain'},body:body});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const out=JSON.parse(await r.text());
  if(!out||out.ok===false) throw new Error((out&&out.error)||'save failed');
  if(out.saved===false && Number(out.updatedAt)>sliceStamp(cls,week)){
    const fresh=await fetchRemoteSlice(cls,week);
    if(fresh.data) mergeSlice(cls,week,fresh.data,fresh.updatedAt);
  }
  return out;
}
function saveState(){
  STATE._sync=STATE._sync||{}; STATE._sync.items=STATE._sync.items||{};
  const tmStamp=Date.now(), cls=curClass, week=curMon, key=sliceKey(cls,week);
  STATE._sync.updatedAt=tmStamp; STATE._sync.items[key]=tmStamp;
  const s=JSON.stringify(STATE);
  const tm=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  try{ localStorage.setItem(WKEY,s); }
  catch(e){ console.error('local save failed',e); flash('브라우저 저장 실패 — 내보내기로 백업하세요'); return; }
  if(HAS_WS){
    try{ const p=window.storage.set(WKEY,s,true); if(p&&typeof p.catch==='function') p.catch(e=>console.warn('shared save failed',e)); }
    catch(e){ console.warn('shared save failed',e); }
  }
  flash('브라우저 저장됨 '+tm+' · 온라인 저장 중…');
  postSlice(cls,week)
    .then(out=>{ if(cls===curClass&&week===curMon) flash('브라우저+온라인 저장됨 '+tm); })
    .catch(e=>{ console.warn('server save failed',e); if(cls===curClass&&week===curMon) flash('브라우저 저장됨 '+tm+' · 온라인 저장 실패'); });
}
function scheduleSave(){ lastInputTs=Date.now(); clearTimeout(saveTimer); saveTimer=setTimeout(()=>{saveTimer=null; saveState();},600); }'''

          s=re.sub(r"function normState\(d\)\{[\s\S]*?function scheduleSave\(\)\{ lastInputTs=Date\.now\(\); clearTimeout\(saveTimer\); saveTimer=setTimeout\(\(\)=>\{saveTimer=null; saveState\(\);\},600\); \}", new_storage, s, count=1)

          s=s.replace("for(let c=1;c<=9;c++){ const b=document.createElement('button'); b.className='cl'+(c===curClass?' on':''); b.textContent=c; b.onclick=()=>{curClass=c; render();}; pk.appendChild(b); }", "for(let c=1;c<=9;c++){ const b=document.createElement('button'); b.className='cl'+(c===curClass?' on':''); b.textContent=c; b.onclick=()=>{curClass=c; render(); syncCurrentFromServer(false);}; pk.appendChild(b); }")

          old_buttons=r'''document.getElementById('prevWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),-7)); render(); };
document.getElementById('nextWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),7)); render(); };
document.getElementById('thisWk').onclick=()=>{ curMon=chooseDefaultMonday(); mobDay=defaultDay(); render(); };'''
          new_buttons=r'''document.getElementById('prevWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),-7)); render(); syncCurrentFromServer(false); };
document.getElementById('nextWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),7)); render(); syncCurrentFromServer(false); };
document.getElementById('thisWk').onclick=()=>{ curMon=chooseDefaultMonday(); mobDay=defaultDay(); render(); syncCurrentFromServer(false); };'''
          s=s.replace(old_buttons,new_buttons)

          s=re.sub(r"document\.getElementById\('serverBtn'\)\.onclick=\(\)=>\{[\s\S]*?function applyServerUI\(\)\{ document\.getElementById\('serverBtn'\)\.textContent=wserver\?'🌐 공유 서버 연결됨 \(변경\)':'🌐 공유 서버 연결'; \}", "document.getElementById('serverBtn').onclick=()=>syncCurrentFromServer(true);\nfunction applyServerUI(){ document.getElementById('serverBtn').textContent='🌐 온라인 공유 저장됨'; }", s, count=1)

          s=re.sub(r"function flash\(msg\)\{[\s\S]*?\n\}", "function flash(msg){\n  const el=document.getElementById('saveHint');\n  const base='🌐 자동 온라인 공유 저장 · 반/주차별 독립 저장 · 브라우저 백업 유지. ';\n  el.innerHTML=base+(msg?'<b>'+esc(msg)+'</b>':'');\n}", s, count=1)

          new_poll=r'''function startPoll(){
  clearInterval(pollTimer); if(!wserver) return;
  pollTimer=setInterval(async()=>{
    if(Date.now()-lastInputTs<7000||saveTimer) return;
    const ae=document.activeElement; if(ae&&ae.isContentEditable) return;
    if(document.getElementById('ttBack').classList.contains('on')) return;
    await syncCurrentFromServer(false);
  },15000);
}'''
          s=re.sub(r"function startPoll\(\)\{[\s\S]*?\n\}", new_poll, s, count=1)

          new_init=r'''(async function init(){
  applyServerUI(); flash('연결 중…');
  await loadEvents();
  STATE=await loadState();
  render();
  await syncCurrentFromServer(false);
  startPoll();
  flash('온라인 공유 저장 연결됨');
})();'''
          s=re.sub(r"\(async function init\(\)\{[\s\S]*?\}\)\(\);", new_init, s, count=1)

          required=[url,'function fetchRemoteSlice','function postSlice','반/주차별 독립 저장','온라인 공유 저장됨']
          for x in required:
            if x not in s: raise SystemExit('required patch missing: '+x)
          p.write_text(s,encoding='utf-8')
          PY

          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('script block not found');
          new Function(m[1]);
          console.log('JavaScript syntax OK');
          NODE

      - name: Commit patched site
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable automatic class-week shared storage'
          git push origin HEAD:main
