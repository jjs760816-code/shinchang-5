<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주간학습 안내 연결 중</title><style>body{font-family:system-ui,sans-serif;text-align:center;padding:40px;color:#334} .box{max-width:560px;margin:auto;padding:28px;border:1px solid #ddd;border-radius:16px;background:#fff}</style></head><body><div class="box" id="loading">온라인 공유 저장을 연결하는 중입니다…</div><script>(async()=>{const SERVER='https://script.google.com/macros/s/AKfycbwS7l_Uf_JVNrtzQk14IyyReQF1omCGk_a8WIz6big35aM8U9lrCZonqkA2_P5Jo7ntaQ/exec';try{const res=await fetch('app-base.html?v=1');if(!res.ok)throw new Error('기본 화면을 불러오지 못했습니다.');const src=await res.text();const doc=new DOMParser().parseFromString(src,'text/html');const sb=doc.getElementById('serverBtn');if(sb)sb.textContent='🌐 온라인 공유 저장';const help=doc.querySelector('.helpbox');if(help)help.innerHTML=help.innerHTML.replace('· 좁은 화면에서는 요일별 보기로 자동 전환됩니다. <code>🌐 공유 서버 연결</code> 주소가 있으면 같은 주소를 여는 누구나 보고 고칠 수 있어, 학부모도 인쇄 없이 바로 봅니다.','· 좁은 화면에서는 요일별 보기로 자동 전환됩니다. <b>온라인 공유 저장은 자동 연결</b>되며, 1~9반 자료가 반·주차별로 나뉘어 저장되어 다른 컴퓨터에서도 같은 내용을 확인·수정할 수 있습니다.');let js=doc.querySelector('script').textContent;function rep(a,b,n){const old=js;js=js.replace(a,b);if(js===old)throw new Error('코드 변환 실패: '+n);}rep("const DEFAULT_WSERVER='';",`const DEFAULT_WSERVER='${SERVER}';`,'server');rep("let wserver=DEFAULT_WSERVER; try{ wserver=localStorage.getItem(WSERVER_KEY)||DEFAULT_WSERVER; }catch(e){}","let wserver=DEFAULT_WSERVER;",'server override');const storage=`function normState(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) return {plans:{},tt:null,subjColors:{},_sync:{updatedAt:0,items:{}}};
  const sync=(d._sync&&typeof d._sync==='object')?d._sync:{};
  const plans=(d.plans&&typeof d.plans==='object')?d.plans:{};
  const items=(sync.items&&typeof sync.items==='object')?sync.items:{};
  const legacy=Number(sync.updatedAt)||0;
  if(legacy && Object.keys(items).length===0){ Object.keys(plans).forEach(k=>items[k]=legacy); }
  return {plans:plans,tt:(d.tt&&typeof d.tt==='object')?d.tt:null,subjColors:(d.subjColors&&typeof d.subjColors==='object')?d.subjColors:{},_sync:{updatedAt:legacy,items:items}};
}
function sliceKey(cls,week){ return week+'#'+cls; }
function sliceStamp(cls,week){ const it=STATE&&STATE._sync&&STATE._sync.items; return it?(Number(it[sliceKey(cls,week)])||0):0; }
function makeSlice(cls,week){ const k=sliceKey(cls,week); return {plan:STATE.plans&&STATE.plans[k]?clone(STATE.plans[k]):null,tt:(STATE.tt&&STATE.tt[cls])?clone(STATE.tt[cls]):null,subjColors:clone(STATE.subjColors||{}),_sync:{updatedAt:sliceStamp(cls,week)}}; }
function mergeSlice(cls,week,data,stamp){ if(!data||typeof data!=='object')return false; const k=sliceKey(cls,week); if(data.plan&&typeof data.plan==='object')STATE.plans[k]=data.plan; else if(data.plan===null&&STATE.plans[k])delete STATE.plans[k]; if(data.tt&&typeof data.tt==='object'){STATE.tt=STATE.tt||{};STATE.tt[cls]=data.tt;} if(data.subjColors&&typeof data.subjColors==='object')STATE.subjColors=data.subjColors; STATE._sync=STATE._sync||{};STATE._sync.items=STATE._sync.items||{};STATE._sync.items[k]=Number(stamp||(data._sync&&data._sync.updatedAt))||0;STATE._sync.updatedAt=Math.max(Number(STATE._sync.updatedAt)||0,STATE._sync.items[k]);try{localStorage.setItem(WKEY,JSON.stringify(STATE));}catch(e){} return true; }
function remoteURL(cls,week){return wserver+(wserver.indexOf('?')>=0?'&':'?')+'class='+encodeURIComponent(cls)+'&week='+encodeURIComponent(week)+'&t='+Date.now();}
async function fetchRemoteSlice(cls,week){const r=await fetch(remoteURL(cls,week));if(!r.ok)throw new Error('HTTP '+r.status);const o=JSON.parse(await r.text());if(!o||o.ok===false)throw new Error((o&&o.error)||'server response error');return o;}
async function loadState(){let local=null;try{const r=localStorage.getItem(WKEY);if(r)local=normState(JSON.parse(r));}catch(e){} if(!local&&HAS_WS){try{const r=await window.storage.get(WKEY,true);if(r&&r.value)local=normState(JSON.parse(r.value));}catch(e){}} const chosen=local||normState(null);try{localStorage.setItem(WKEY,JSON.stringify(chosen));}catch(e){} return chosen;}
async function postSlice(cls,week){const body=JSON.stringify({class:cls,week:week,data:makeSlice(cls,week)});const r=await fetch(wserver,{method:'POST',headers:{'Content-Type':'text/plain'},body:body});if(!r.ok)throw new Error('HTTP '+r.status);const o=JSON.parse(await r.text());if(!o||o.ok===false)throw new Error((o&&o.error)||'save failed');return o;}
async function syncCurrentFromServer(showMessage){if(!wserver)return;const cls=curClass,week=curMon;try{const o=await fetchRemoteSlice(cls,week);const rs=Number(o.updatedAt)||0,ls=sliceStamp(cls,week);if(o.data&&rs>ls){mergeSlice(cls,week,o.data,rs);if(cls===curClass&&week===curMon)render();if(showMessage)flash('온라인 최신 내용 반영됨');}else if(!o.data&&ls>0){await postSlice(cls,week);if(showMessage)flash('기존 자료를 온라인에 올렸습니다');}else if(showMessage)flash('온라인 최신 상태입니다');}catch(e){console.warn(e);if(showMessage)flash('온라인 연결 확인 필요 · 브라우저 저장은 유지됨');}}
function saveState(){STATE._sync=STATE._sync||{};STATE._sync.items=STATE._sync.items||{};const ts=Date.now(),cls=curClass,week=curMon,k=sliceKey(cls,week);STATE._sync.updatedAt=ts;STATE._sync.items[k]=ts;const s=JSON.stringify(STATE);const tm=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});try{localStorage.setItem(WKEY,s);}catch(e){flash('브라우저 저장 실패 — 내보내기로 백업하세요');return;} if(HAS_WS){try{const p=window.storage.set(WKEY,s,true);if(p&&p.catch)p.catch(()=>{});}catch(e){}} flash('브라우저 저장됨 '+tm+' · 온라인 저장 중…');postSlice(cls,week).then(()=>{if(cls===curClass&&week===curMon)flash('브라우저+온라인 저장됨 '+tm);}).catch(()=>{if(cls===curClass&&week===curMon)flash('브라우저 저장됨 '+tm+' · 온라인 저장 실패');});}
function scheduleSave(){ lastInputTs=Date.now(); clearTimeout(saveTimer); saveTimer=setTimeout(()=>{saveTimer=null; saveState();},600); }`;
rep(/function normState\(d\)\{[\s\S]*?function scheduleSave\(\)\{ lastInputTs=Date\.now\(\); clearTimeout\(saveTimer\); saveTimer=setTimeout\(\(\)=>\{saveTimer=null; saveState\(\);\},600\); \}/,storage,'storage');rep("for(let c=1;c<=9;c++){ const b=document.createElement('button'); b.className='cl'+(c===curClass?' on':''); b.textContent=c; b.onclick=()=>{curClass=c; render();}; pk.appendChild(b); }","for(let c=1;c<=9;c++){ const b=document.createElement('button'); b.className='cl'+(c===curClass?' on':''); b.textContent=c; b.onclick=()=>{curClass=c; render(); syncCurrentFromServer(false);}; pk.appendChild(b); }",'class switch');rep("document.getElementById('prevWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),-7)); render(); };","document.getElementById('prevWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),-7)); render(); syncCurrentFromServer(false); };",'prev');rep("document.getElementById('nextWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),7)); render(); };","document.getElementById('nextWk').onclick=()=>{ curMon=fmt(addDays(parse(curMon),7)); render(); syncCurrentFromServer(false); };",'next');rep("document.getElementById('thisWk').onclick=()=>{ curMon=chooseDefaultMonday(); mobDay=defaultDay(); render(); };","document.getElementById('thisWk').onclick=()=>{ curMon=chooseDefaultMonday(); mobDay=defaultDay(); render(); syncCurrentFromServer(false); };",'this week');rep(/document\.getElementById\('serverBtn'\)\.onclick=\(\)=>\{[\s\S]*?function applyServerUI\(\)\{[^\n]*\}/,"document.getElementById('serverBtn').onclick=()=>syncCurrentFromServer(true);\nfunction applyServerUI(){ document.getElementById('serverBtn').textContent='🌐 온라인 공유 저장됨'; }",'server button');rep(/function flash\(msg\)\{[\s\S]*?\n\}/,"function flash(msg){\n  const el=document.getElementById('saveHint');\n  const base='🌐 자동 온라인 공유 저장 · 반/주차별 독립 저장 · 브라우저 백업 유지. ';\n  el.innerHTML=base+(msg?'<b>'+esc(msg)+'</b>':'');\n}",'flash');rep(/function startPoll\(\)\{[\s\S]*?\n\}/,"function startPoll(){\n  clearInterval(pollTimer); if(!wserver) return;\n  pollTimer=setInterval(async()=>{\n    if(Date.now()-lastInputTs<7000||saveTimer) return;\n    const ae=document.activeElement; if(ae&&ae.isContentEditable) return;\n    if(document.getElementById('ttBack').classList.contains('on')) return;\n    await syncCurrentFromServer(false);\n  },15000);\n}",'poll');rep(/\(async function init\(\)\{[\s\S]*?\}\)\(\);/,"(async function init(){\n  applyServerUI(); flash('연결 중…');\n  await loadEvents();\n  STATE=await loadState();\n  render();\n  await syncCurrentFromServer(false);\n  startPoll();\n  flash('온라인 공유 저장 연결됨');\n})();",'init');doc.querySelector('script').textContent=js;document.open();document.write('<!DOCTYPE html>'+doc.documentElement.outerHTML);document.close();}catch(e){console.error(e);document.getElementById('loading').innerHTML='<b>화면 연결 중 오류가 발생했습니다.</b><br><br>새로고침해 주세요.<br><small>'+String(e.message||e)+'</small>';}})();</script></body></html>
